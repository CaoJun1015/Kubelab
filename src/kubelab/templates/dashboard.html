{% extends "base.html" %}
{% block content %}
<section class="hero compact-hero">
  <div>
    <p class="eyebrow">LOCAL OPERATIONS LAB</p>
    <h1>今天，从一个真实故障开始。</h1>
    <p>观察资源、形成假设、动手修复，再用声明式检查验证结果。</p>
  </div>
  <a class="button primary" href="/paths">开始专题学习</a>
</section>

<div id="page-error" class="alert error hidden" role="alert"></div>

<section class="metric-grid" aria-label="学习概览">
  <article class="metric-card"><span>实验总数</span><strong id="metric-total">—</strong></article>
  <article class="metric-card"><span>已完成</span><strong id="metric-completed">—</strong></article>
  <article class="metric-card"><span>进行中</span><strong id="metric-active">—</strong></article>
  <article class="metric-card accent"><span>完成率</span><strong id="metric-rate">—</strong></article>
</section>

<div class="dashboard-grid">
  <section class="panel" aria-labelledby="environment-title">
    <div class="panel-heading">
      <div><p class="eyebrow">RUNTIME</p><h2 id="environment-title">运行环境</h2></div>
      <span id="environment-status" class="status-badge neutral">检查中</span>
    </div>
    <dl id="environment-details" class="detail-list skeleton-lines" aria-live="polite"></dl>
  </section>

  <section class="panel" aria-labelledby="active-title">
    <div class="panel-heading">
      <div><p class="eyebrow">ACTIVE SESSION</p><h2 id="active-title">当前实验</h2></div>
    </div>
    <div id="active-session" class="empty-state" aria-live="polite">
      <p>正在读取活动 Session…</p>
    </div>
  </section>
</div>

<section class="panel" aria-labelledby="next-learning-title">
  <div class="panel-heading">
    <div><p class="eyebrow">NEXT PRACTICE</p><h2 id="next-learning-title">推荐下一步</h2></div>
    <a class="text-link" href="/paths">查看路径</a>
  </div>
  <div id="learning-recommendation" class="recommendation-card" aria-live="polite"></div>
</section>

<section class="panel" aria-labelledby="path-summary-title">
  <div class="panel-heading"><div><p class="eyebrow">LEARNING PATHS</p><h2 id="path-summary-title">专题进度</h2></div><a class="text-link" href="/symptoms">症状索引</a></div>
  <div id="dashboard-paths" class="card-grid path-grid" aria-live="polite"></div>
</section>
{% endblock %}
