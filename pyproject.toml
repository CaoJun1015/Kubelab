[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kubelab"
version = "0.1.0a0"
description = "Local Kubernetes operations practice platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "kubernetes>=31,<40",
    "pydantic>=2.10,<3",
    "portalocker>=3,<4",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "tomli-w>=1.2,<2",
    "typer>=0.12,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
kubelab = "kubelab.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/kubelab"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "--cov=kubelab",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that use the explicitly trusted local minikube cluster",
]

[tool.coverage.run]
branch = true
source = ["kubelab"]
omit = ["src/kubelab/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
pretty = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true
