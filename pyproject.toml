[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kubelab"
version = "0.3.0a0"
description = "Local Kubernetes operations practice platform"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "CaoJun" },
]
requires-python = ">=3.11,<3.12"
keywords = [
    "kubernetes",
    "minikube",
    "operations",
    "training",
    "troubleshooting",
    "wsl2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "kubernetes>=31,<40",
    "pydantic>=2.10,<3",
    "portalocker>=3,<4",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "tomli-w>=1.2,<2",
    "typer>=0.12,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
kubelab = "kubelab.cli:app"

[project.urls]
Homepage = "https://github.com/CaoJun1015/Kubelab"
Documentation = "https://github.com/CaoJun1015/Kubelab#readme"
Repository = "https://github.com/CaoJun1015/Kubelab.git"
Issues = "https://github.com/CaoJun1015/Kubelab/issues"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[tool.uv]
package = true

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/kubelab"]

[tool.hatch.build.targets.wheel.force-include]
"labs" = "kubelab/labs"
"README.md" = "kubelab/docs/README.md"
"LICENSE" = "kubelab/docs/LICENSE"
"CONTRIBUTING.md" = "kubelab/docs/CONTRIBUTING.md"
"SECURITY.md" = "kubelab/docs/SECURITY.md"
"CHANGELOG.md" = "kubelab/docs/CHANGELOG.md"
"docs" = "kubelab/docs/project"

[tool.hatch.build.targets.sdist]
only-include = [
    ".github",
    ".gitattributes",
    ".gitignore",
    ".python-version",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "PRD-KubeLab.md",
    "README.md",
    "SECURITY.md",
    "TDD-KubeLab.md",
    "alembic.ini",
    "docs",
    "labs",
    "pyproject.toml",
    "schemas",
    "scripts",
    "src",
    "uv.lock",
]
exclude = [
    "**/.cache/**",
    "**/.mypy_cache/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/.uv-cache*/**",
    "**/.venv*/**",
    "**/__pycache__/**",
    "**/*.db",
    "**/*.db-*",
    "**/*.log",
    "**/*.pyc",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "--cov=kubelab",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that use the explicitly trusted local minikube cluster",
]

[tool.coverage.run]
branch = true
source = ["kubelab"]
omit = ["src/kubelab/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
pretty = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true
