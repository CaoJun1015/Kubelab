apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: kubelab-configmap-missing}
spec:
  replicas: 1
  selector:
    matchLabels: {app: configmap-missing-lab}
  template:
    metadata:
      labels: {app: configmap-missing-lab}
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          command: [sh, -c, "echo mode=$APP_MODE; while true; do sleep 30; done"]
          envFrom:
            - configMapRef: {name: app-settings}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
