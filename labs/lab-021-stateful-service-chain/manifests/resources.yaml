apiVersion: v1
kind: Service
metadata: {name: web-headless, namespace: kubelab-stateful-service-chain}
spec:
  clusterIP: None
  selector: {app: stateful-service-does-not-match}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: web, namespace: kubelab-stateful-service-chain, labels: {app: stateful-service-chain}}
spec:
  serviceName: web-headless
  replicas: 1
  selector: {matchLabels: {app: stateful-service-chain}}
  template:
    metadata: {labels: {app: stateful-service-chain}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      volumes: [{name: nginx-cache, emptyDir: {}}, {name: nginx-run, emptyDir: {}}]
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{name: http, containerPort: 80}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts: [{name: nginx-cache, mountPath: /var/cache/nginx}, {name: nginx-run, mountPath: /run}]
