apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: kubelab-probes}
spec:
  replicas: 1
  selector:
    matchLabels: {app: probes-lab}
  template:
    metadata:
      labels: {app: probes-lab}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{name: http, containerPort: 80}]
          livenessProbe:
            httpGet: {path: /does-not-exist, port: http}
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 1
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
