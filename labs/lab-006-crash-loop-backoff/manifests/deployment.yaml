apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kubelab-crash-loop-backoff
  labels:
    app: crash-loop-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-loop-lab
  template:
    metadata:
      labels:
        app: crash-loop-lab
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          command: [sh, -c, "echo worker-started; sleep 1; exit 1"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
