apiVersion: kubelab.io/v1alpha1
kind: Lab
metadata:
  id: lab-006-crash-loop
  name: LAB-006 CrashLoopBackOff
  description: 容器启动后立即异常退出，Pod不断重启并进入CrashLoopBackOff。
  difficulty: beginner
  durationMinutes: 25
  category: workloads
  tags: [deployment, crashloop, logs]
requirements:
  kubernetes: ">=1.28"
  minimumCpu: 1
  minimumMemoryMiB: 1024
  addons: []
environment:
  namespace: kubelab-crash-loop-backoff
  manifests:
    - manifests/deployment.yaml
  provisionTimeoutSeconds: 180
task:
  description: 结合当前日志、previous日志和容器状态定位退出原因，让worker持续稳定运行。
  completionDescription: Deployment可用，worker容器不再重启并持续Ready。
  successMessage: 容器启动命令已经修复，工作负载恢复稳定。
initialChecks:
  - id: deployment-created
    type: resource_exists
    apiVersion: apps/v1
    kind: Deployment
    name: worker
    timeoutSeconds: 10
    unmetMessage: 故障Deployment未成功创建。
  - id: crash-loop-observed
    type: pod_status
    selector:
      app: crash-loop-lab
    expectedPhase: Running
    minimumCount: 1
    ready: false
    containerName: worker
    expectedWaitingReasons: [CrashLoopBackOff]
    minimumRestartCount: 1
    timeoutSeconds: 120
    unmetMessage: Pod尚未呈现预期的CrashLoopBackOff和重启计数。
successChecks:
  - id: deployment-available
    type: deployment_available
    name: worker
    minimumReplicas: 1
    timeoutSeconds: 15
    unmetMessage: Deployment仍然没有可用副本。
  - id: worker-stable
    type: pod_status
    selector:
      app: crash-loop-lab
    expectedPhase: Running
    minimumCount: 1
    minimumReady: 1
    stableSeconds: 10
    ready: true
    containerName: worker
    maximumRestartCount: 0
    timeoutSeconds: 45
    unmetMessage: worker尚未稳定运行，或修复后的Pod仍发生重启。
hints:
  - level: 1
    content: 同时查看容器当前状态、重启次数和previous日志。
  - level: 2
    content: 检查Deployment中worker容器的command是否会主动退出。
  - level: 3
    content: 把worker命令改为不会退出的持续运行循环。
cleanup:
  deleteNamespace: true
interview:
  questions:
    - CrashLoopBackOff为什么是一种退避状态而不是根因？
    - kubectl logs --previous在这个场景中解决什么问题？
    - 如何判断修复后的容器已经稳定而不是暂时Running？
