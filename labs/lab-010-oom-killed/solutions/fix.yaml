apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: kubelab-oom-killed}
spec:
  replicas: 1
  selector:
    matchLabels: {app: oom-killed-lab}
  template:
    metadata:
      labels: {app: oom-killed-lab}
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          command: [sh, -c, "while true; do echo worker-ok; sleep 30; done"]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
