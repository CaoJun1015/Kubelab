apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-agent, namespace: kubelab-daemonset-node-selector, labels: {app: daemonset-node-selector-lab}}
spec:
  selector: {matchLabels: {app: daemonset-node-selector-lab}}
  template:
    metadata: {labels: {app: daemonset-node-selector-lab}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubelab.io/node-pool, operator: In, values: [missing]}
      containers:
        - name: agent
          image: busybox:1.36.1
          command: [sh, -c, "while true; do sleep 30; done"]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
