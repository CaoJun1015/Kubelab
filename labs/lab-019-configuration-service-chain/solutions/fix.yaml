apiVersion: v1
kind: ConfigMap
metadata: {name: app-settings, namespace: kubelab-configuration-service-chain}
data: {LOG_LEVEL: info, APP_MODE: production}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: kubelab-configuration-service-chain}
spec:
  selector: {app: configuration-service-chain}
  ports: [{name: http, port: 80, targetPort: http}]
