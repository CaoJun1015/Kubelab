apiVersion: v1
kind: ConfigMap
metadata: {name: app-settings, namespace: kubelab-configuration-service-chain}
data: {LOG_LEVEL: info}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: kubelab-configuration-service-chain}
spec:
  replicas: 1
  selector: {matchLabels: {app: configuration-service-chain}}
  template:
    metadata: {labels: {app: configuration-service-chain}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      volumes: [{name: nginx-cache, emptyDir: {}}, {name: nginx-run, emptyDir: {}}]
      containers:
        - name: web
          image: nginx:1.27-alpine
          env:
            - name: APP_MODE
              valueFrom: {configMapKeyRef: {name: app-settings, key: APP_MODE}}
          ports: [{name: http, containerPort: 80}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts: [{name: nginx-cache, mountPath: /var/cache/nginx}, {name: nginx-run, mountPath: /run}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: kubelab-configuration-service-chain}
spec:
  selector: {app: configuration-service-chain}
  ports: [{name: http, port: 80, targetPort: 8080}]
