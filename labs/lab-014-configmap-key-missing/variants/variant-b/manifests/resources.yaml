apiVersion: v1
kind: ConfigMap
metadata: {name: app-settings, namespace: kubelab-configmap-key-missing}
data: {APP_MODE: production, LOG_LEVEL: info}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: kubelab-configmap-key-missing}
spec:
  replicas: 1
  selector: {matchLabels: {app: config-key-lab}}
  template:
    metadata: {labels: {app: config-key-lab}}
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          command: [sh, -c, "echo mode=$APP_MODE; while true; do sleep 30; done"]
          env:
            - name: APP_MODE
              valueFrom: {configMapKeyRef: {name: app-settings-current, key: APP_MODE}}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
