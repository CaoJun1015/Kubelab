apiVersion: kubelab.io/v1alpha1
kind: LabAuthoringContract
scenarioType: variant
states:
  faulted:
    observations:
      app-mode-present:
        type: config_value
        resourceExists: true
        keyExists: true
        matched: true
        validEncoding: true
      pod-config-error:
        type: pod_status
        pods:
        - name: worker-abc
          phase: Pending
          ready: false
          restartCount: 0
          containers:
          - name: worker
            image: busybox:1.36.1
            ready: false
            restartCount: 0
            state: waiting
            reason: CreateContainerConfigError
      app-mode-preserved:
        type: config_value
        resourceExists: true
        keyExists: true
        matched: true
        validEncoding: true
      worker-ready:
        type: pod_status
        pods:
        - name: worker-abc
          phase: Pending
          ready: false
          restartCount: 0
          containers:
          - name: worker
            image: busybox:1.36.1
            ready: false
            restartCount: 0
            state: waiting
            reason: CreateContainerConfigError
  repaired:
    observations:
      app-mode-present:
        type: config_value
        resourceExists: true
        keyExists: true
        matched: true
        validEncoding: true
      pod-config-error:
        type: pod_status
        pods:
        - name: worker-abc
          phase: Running
          ready: true
          restartCount: 0
          containers:
          - name: worker
            image: busybox:1.36.1
            ready: true
            restartCount: 0
            state: running
      app-mode-preserved:
        type: config_value
        resourceExists: true
        keyExists: true
        matched: true
        validEncoding: true
      worker-ready:
        type: pod_status
        pods:
        - name: worker-abc
          phase: Running
          ready: true
          restartCount: 0
          containers:
          - name: worker
            image: busybox:1.36.1
            ready: true
            restartCount: 0
            state: running
  reset: faulted
repairs:
  full:
    manifest: solutions/fix.yaml
    allowedChanges:
    - resource:
        apiVersion: apps/v1
        kind: Deployment
        name: worker
      operation: modify
      paths:
      - /spec/template/spec/containers
