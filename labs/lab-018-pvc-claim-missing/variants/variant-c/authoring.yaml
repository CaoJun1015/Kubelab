apiVersion: kubelab.io/v1alpha1
kind: LabAuthoringContract
scenarioType: variant
states:
  faulted:
    observations:
      app-data-bound:
        type: pvc_status
        phase: Bound
      consumer-write-failure:
        type: pod_status
        pods:
        - name: consumer-abc
          phase: Running
          ready: false
          restartCount: 2
          containers:
          - name: consumer
            image: busybox:1.36.1
            ready: false
            restartCount: 2
            state: waiting
            reason: CrashLoopBackOff
      app-data-still-bound:
        type: pvc_status
        phase: Bound
      consumer-ready:
        type: pod_status
        pods:
        - name: consumer-abc
          phase: Running
          ready: false
          restartCount: 2
          containers:
          - name: consumer
            image: busybox:1.36.1
            ready: false
            restartCount: 2
            state: waiting
            reason: CrashLoopBackOff
  repaired:
    observations:
      app-data-bound:
        type: pvc_status
        phase: Bound
      consumer-write-failure:
        type: pod_status
        pods:
        - name: consumer-abc
          phase: Running
          ready: true
          restartCount: 0
          containers:
          - name: consumer
            image: busybox:1.36.1
            ready: true
            restartCount: 0
            state: running
      app-data-still-bound:
        type: pvc_status
        phase: Bound
      consumer-ready:
        type: pod_status
        pods:
        - name: consumer-abc
          phase: Running
          ready: true
          restartCount: 0
          containers:
          - name: consumer
            image: busybox:1.36.1
            ready: true
            restartCount: 0
            state: running
  reset: faulted
repairs:
  full:
    manifest: solutions/fix.yaml
    allowedChanges:
    - resource:
        apiVersion: apps/v1
        kind: Deployment
        name: consumer
      operation: modify
      paths:
      - /spec/template/spec/containers
