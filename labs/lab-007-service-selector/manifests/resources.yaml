apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kubelab-service-selector
  labels:
    app: service-selector-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-selector-lab
  template:
    metadata:
      labels:
        app: service-selector-lab
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kubelab-service-selector
spec:
  selector:
    app: selector-does-not-match
  ports:
    - name: http
      port: 80
      targetPort: http
