apiVersion: kubelab.io/v1alpha1
kind: LabAuthoringContract
scenarioType: baseline
states:
  faulted:
    observations:
      deployment-available:
        type: deployment_available
        availableReplicas: 1
      endpoints-empty:
        type: service_endpoint_count
        count: 0
      endpoints-restored:
        type: service_endpoint_count
        count: 0
      http-restored:
        type: http_response
        targetAvailable: true
        statusCode: null
        exitCode: 6
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
  repaired:
    observations:
      deployment-available:
        type: deployment_available
        availableReplicas: 1
      endpoints-empty:
        type: service_endpoint_count
        count: 1
      endpoints-restored:
        type: service_endpoint_count
        count: 1
      http-restored:
        type: http_response
        targetAvailable: true
        statusCode: 200
        exitCode: 0
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
  reset: faulted
repairs:
  full:
    manifest: solutions/fix.yaml
    allowedChanges:
    - resource:
        apiVersion: v1
        kind: Service
        name: web
      operation: modify
      paths:
      - /spec/selector/app
