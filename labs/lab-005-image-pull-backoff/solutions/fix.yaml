apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kubelab-image-pull-backoff
  labels:
    app: image-pull-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-pull-lab
  template:
    metadata:
      labels:
        app: image-pull-lab
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
