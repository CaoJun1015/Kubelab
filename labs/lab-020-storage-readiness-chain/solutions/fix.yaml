apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: app-data, namespace: kubelab-storage-readiness-chain}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources: {requests: {storage: 128Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: kubelab-storage-readiness-chain}
spec:
  replicas: 1
  selector: {matchLabels: {app: storage-readiness-chain}}
  template:
    metadata: {labels: {app: storage-readiness-chain}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: app-data}}
        - {name: nginx-cache, emptyDir: {}}
        - {name: nginx-run, emptyDir: {}}
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{name: http, containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 2, periodSeconds: 3}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /run}
