apiVersion: kubelab.io/v1alpha1
kind: LabAuthoringContract
scenarioType: baseline
states:
  faulted:
    observations:
      stateful-pod-ready:
        type: pod_status
        pods:
        - name: web-0
          phase: Running
          ready: true
          restartCount: 0
          containers:
          - name: web
            image: nginx:1.27-alpine
            ready: true
            restartCount: 0
            state: running
      headless-endpoints-empty:
        type: service_endpoint_count
        count: 0
      headless-endpoints-restored:
        type: service_endpoint_count
        count: 0
      headless-http-restored:
        type: http_response
        targetAvailable: true
        statusCode: null
        exitCode: 6
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
  repaired:
    observations:
      stateful-pod-ready:
        type: pod_status
        pods:
        - name: web-0
          phase: Running
          ready: true
          restartCount: 0
          containers:
          - name: web
            image: nginx:1.27-alpine
            ready: true
            restartCount: 0
            state: running
      headless-endpoints-empty:
        type: service_endpoint_count
        count: 1
      headless-endpoints-restored:
        type: service_endpoint_count
        count: 1
      headless-http-restored:
        type: http_response
        targetAvailable: true
        statusCode: 200
        exitCode: 0
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
  reset: faulted
repairs:
  full:
    manifest: solutions/fix.yaml
    allowedChanges:
    - resource:
        apiVersion: v1
        kind: Service
        name: web-headless
      operation: modify
      paths:
      - /spec/selector/app
