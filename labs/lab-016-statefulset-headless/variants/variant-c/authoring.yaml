apiVersion: kubelab.io/v1alpha1
kind: LabAuthoringContract
scenarioType: variant
states:
  faulted:
    observations:
      stateful-pod-ready:
        type: pod_status
        pods:
        - name: web-0
          phase: Running
          ready: true
          restartCount: 0
          containers:
          - name: web
            image: nginx:1.27-alpine
            ready: true
            restartCount: 0
            state: running
      stable-dns-missing:
        type: dns_resolution
        resolved: false
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
      endpoints-present:
        type: service_endpoint_count
        count: 1
      stable-dns-restored:
        type: dns_resolution
        resolved: false
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
      service-http-ok:
        type: http_response
        targetAvailable: true
        statusCode: 200
        exitCode: 0
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
  repaired:
    observations:
      stateful-pod-ready:
        type: pod_status
        pods:
        - name: web-0
          phase: Running
          ready: true
          restartCount: 0
          containers:
          - name: web
            image: nginx:1.27-alpine
            ready: true
            restartCount: 0
            state: running
      stable-dns-missing:
        type: dns_resolution
        resolved: true
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
      endpoints-present:
        type: service_endpoint_count
        count: 1
      stable-dns-restored:
        type: dns_resolution
        resolved: true
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
      service-http-ok:
        type: http_response
        targetAvailable: true
        statusCode: 200
        exitCode: 0
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
  reset: faulted
repairs:
  full:
    manifest: solutions/fix.yaml
    allowedChanges:
    - resource:
        apiVersion: v1
        kind: Service
        name: web-headless
      operation: recreate
      paths:
      - /spec/clusterIP
