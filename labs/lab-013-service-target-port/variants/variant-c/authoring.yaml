apiVersion: kubelab.io/v1alpha1
kind: LabAuthoringContract
scenarioType: variant
states:
  faulted:
    observations:
      deployment-ready:
        type: deployment_available
        availableReplicas: 1
      endpoint-present:
        type: service_endpoint_count
        count: 1
      endpoint-preserved:
        type: service_endpoint_count
        count: 1
      service-port-contract:
        type: http_response
        targetAvailable: true
        statusCode: null
        exitCode: 6
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
  repaired:
    observations:
      deployment-ready:
        type: deployment_available
        availableReplicas: 1
      endpoint-present:
        type: service_endpoint_count
        count: 1
      endpoint-preserved:
        type: service_endpoint_count
        count: 1
      service-port-contract:
        type: http_response
        targetAvailable: true
        statusCode: 200
        exitCode: 0
        infrastructureError: false
        timedOut: false
        cleanupWarning: false
  reset: faulted
repairs:
  full:
    manifest: solutions/fix.yaml
    allowedChanges:
    - resource:
        apiVersion: v1
        kind: Service
        name: web
      operation: recreate
      paths:
      - /spec/ports
