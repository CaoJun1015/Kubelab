apiVersion: kubelab.io/v1alpha1
kind: LabVariant
metadata:
  id: variant-c
  sequence: 2
  name: Service暴露端口契约错误
  description: Service能发现后端Pod，但没有在调用方约定的80端口提供服务。
environment:
  manifests: [manifests/resources.yaml]
  provisionTimeoutSeconds: 180
task:
  description: Pod与Endpoint均正常，但调用方约定的Service端口不可用。恢复公开端口契约。
  completionDescription: 保持Selector与容器监听端口不变，使Service的80端口返回HTTP 200。
  successMessage: Service公开端口契约已经恢复。
initialChecks:
  - {id: deployment-ready, type: deployment_available, name: web, minimumReplicas: 1, timeoutSeconds: 120, unmetMessage: Deployment尚未Ready。}
  - {id: endpoint-present, type: service_endpoint_count, name: web, minimum: 1, timeoutSeconds: 30, unmetMessage: Service没有Ready Endpoint。}
successChecks:
  - {id: endpoint-preserved, type: service_endpoint_count, name: web, minimum: 1, timeoutSeconds: 30, unmetMessage: Service没有Ready Endpoint。}
  - id: service-port-contract
    type: http_response
    target: {mode: service, name: web, port: 80, path: /}
    expectedStatus: 200
    timeoutSeconds: 60
    unmetMessage: Service尚未在约定端口返回HTTP 200。
hints:
  - {level: 1, content: 核对调用方使用的Service port，而不只是targetPort。}
  - {level: 2, content: "kubectl get service web -o yaml"}
  - {level: 3, content: 保留targetPort为http，把Service公开port恢复为80。}
reveal:
  keyEvidence: Service仅声明8080端口，而任务的调用契约固定使用80端口。
  rootCause: Service port与调用方约定不一致。
  resolution: 只把Service port从8080改为80。
  prevention: 对Service公开端口建立契约测试，而不是只检查Endpoint数量。
