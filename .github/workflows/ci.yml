name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
    env:
      KUBELAB_RUN_INTEGRATION: "0"
      KUBELAB_RUN_LAB_INTEGRATION: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv 0.12.5
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --dev

      - name: Run tests with coverage gate
        run: uv run pytest

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run strict mypy
        run: uv run mypy --strict src

      - name: Check browser JavaScript syntax
        run: node --check src/kubelab/static/app.js

      - name: Check whitespace errors
        run: git diff --check

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify release artifacts
        run: >-
          uv run python scripts/verify_distribution.py
          --wheel dist/kubelab-0.2.0a0-py3-none-any.whl
          --sdist dist/kubelab-0.2.0a0.tar.gz
          --version 0.2.0a0
