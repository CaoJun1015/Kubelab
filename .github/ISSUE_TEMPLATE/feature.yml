name: 功能建议
description: 建议不改变安全边界的新能力
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明学习或排障流程中的具体痛点。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明预期交互及 CLI、Web、Application Service 的边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
  - type: checkboxes
    id: boundaries
    attributes:
      label: 范围确认
      options:
        - label: 该建议不要求连接远程或生产集群。
          required: true
        - label: 该建议不要求提交或显示凭证、Secret 或完整 kubeconfig。
          required: true
